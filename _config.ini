[KORAIL]
# 코레일(KTX) 로그인 정보
USER_ID = 
USER_PASS = 

[ROUTE]
# 출발역 / 도착역 (역명 그대로 입력)
# 예시 역: 서울, 용산, 광명, 천안아산, 오송, 대전, 동대구, 부산, 익산, 광주송정, 목포 ...
SOURCE = 서울
DESTINATION = 동대구

[SCHEDULE]
# 날짜: YYYYMMDD 형식 (예: 20260320)
DATE = 20260320
# 시작시간: HHMM 또는 HHMMSS (예: 18시 = 1800 또는 180000)
START_TIME = 1800
# 종료시간: HHMM 또는 HHMMSS (예: 19시 = 1900 또는 190000)
END_TIME = 1900

[SEAT]
# 좌석 타입 (아래 중 하나를 입력)
#   일반실 우선 = General / Priority
#   일반실만    = General Only
#   특실 우선   = Special / Priority
#   특실만      = Special Only
TYPE = General / Priority

[PASSENGER]
# 성인 승객 수
ADULTS = 1

[SEARCH]
# 열차 유형: KTX 또는 ALL
TRAIN_TYPE = KTX
# 예약대기 포함 여부 (true/false)
INCLUDE_WAITING_LIST = false

[INTERVAL]
# 조회 간격 랜덤 범위 (초 단위)
MIN_SEC = 10
MAX_SEC = 15

[TELEGRAM]
# 텔레그램 알림 설정 (선택사항, 비워두면 알림 없이 동작)
BOT_TOKEN = 
CHAT_ID = 
